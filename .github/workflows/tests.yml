name: Laravel acceptance checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  laravel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, sqlite3, xml, openssl
          coverage: none
      - name: Confirm locked Composer and npm manifests
        run: test -s composer.lock && test -s package-lock.json
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Runtime dependency security advisory audit
        run: composer audit --no-dev
      - name: Initialize test environment
        run: |
          cp -n .env.example .env
          php artisan key:generate
      - name: Independent acceptance ledger must remain blocked in source
        run: php support/acceptance/check.php support/acceptance/pending.json --expect-blocked
      - name: Host acceptance probe must not approve a GitHub checkout
        run: bash tests/acceptance/host-probe.sh
      - name: Structural localization report (native approval stays external)
        run: php support/acceptance/localization-audit.php > "$RUNNER_TEMP/samith-locales.json"
      - name: Validate guarded production Nginx cutover script syntax
        run: bash tests/acceptance/cutover-syntax.sh
      - name: Check auth eye-icon hotfix script syntax
        run: bash tests/acceptance/auth-eye-hotfix-syntax.sh
      - name: Check login recovery-row production hotfix syntax
        run: bash tests/acceptance/login-recovery-row-syntax.sh
      - name: Validate guarded branding production patch
        run: bash tests/acceptance/branding-deployment-syntax.sh
      - name: Check read-only feature-upgrade preflight syntax
        run: bash tests/acceptance/feature-upgrade-preflight-syntax.sh
      - name: Validate operator-controlled production snapshot utility
        run: bash tests/acceptance/local-backup-syntax.sh
      - name: Validate production feature upgrade script syntax
        run: bash tests/acceptance/feature-upgrade-deploy-syntax.sh
      - name: Validate saved prompts production preflight
        run: bash tests/acceptance/saved-insights-preflight-syntax.sh
      - name: Validate current-v3 encrypted snapshot operator utility
        run: bash tests/acceptance/current-v3-encrypted-backup-syntax.sh
      - name: Validate guarded Saved Prompts production upgrade
        run: bash tests/acceptance/deploy-saved-insights-syntax.sh
      - name: Validate already-installed saved insights reconciliation utility
        run: bash tests/acceptance/reconcile-saved-insights-syntax.sh
      - name: Verify premium admin dashboard production patch syntax
        run: bash tests/acceptance/premium-admin-dashboard-syntax.sh
      - name: Validate user and creator UI deployment syntax
        run: bash tests/acceptance/account-creator-navigation-deploy-syntax.sh
      - name: Verify frontend page builder and feedback deployment utility
        run: bash tests/acceptance/frontend-pages-feedback-deploy-syntax.sh
      - name: Validate safe isolated editorial release staging utilities
        run: bash tests/acceptance/samithai-private-staging-static.sh
      - name: PHP syntax validation
        run: find app bootstrap config database routes tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Compile all Laravel Blade templates and inspect routes
        run: |
          php artisan route:list --except-vendor
          php artisan view:cache
          php artisan view:clear
      - name: Laravel feature tests
        run: php artisan test
      - name: Build Tailwind assets
        run: |
          npm ci --ignore-scripts
          npm run build
